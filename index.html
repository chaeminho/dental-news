</style></head><body><header><span class="logo">🦷</span><h1>미르치과 뉴스 데일리</h1><p class="subtitle">매일 자동으로 업데이트되는 치과 업계 뉴스, 기술 트렌드, 건강보험 정책, SNS 마케팅 트렌드 모음</p><p class="date-heading" id="dh">2026년 10월 07일 뉴스</p><div class="filter-bar"><input type="date" id="dp"/><button id="ba">오늘 뉴스</button></div></header><main id="mc"></main><footer><span class="tooth">🦷</span>매일 자동 업데이트 · 미르치과 뉴스 데일리</footer><script>var ARTS=[{"date": "2026-10-07", "date_label": "2026.10.07", "color": "blue", "tag": "업계뉴스", "icon": "🦷", "title": "K-치과의료기기, 베트남서 우수성 입증 — 아세안 진출 전초기지 다진다", "body": "오스템임플란트·티에네스·아이오바이오 등 국내 주요 치과의료기기 3개사가 베트남 현지 의료진을 대상으로 임상 교육과 제품 전시를 펼치며 아세안 시장 공략 속도를 높이고 있다. 국산 치과의료기기의 품질과 가격 경쟁력이 현지에서 높은 호응을 얻고 있다.", "src_name": "서울신문", "src_url": "https://seoul.co.kr/news/society/health-medical/2026/10/06/20261006500172"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "blue", "tag": "업계뉴스", "icon": "🦷", "title": "국산 치과의료기기 베트남 공략 — 현지 의료진 만나 사업 기회 모색", "body": "한국 치과의료기기 기업들이 베트남에서 현지 치과의사들과 직접 만나 임상 시연과 제품 설명회를 열며 동남아 거점 시장 선점에 나서고 있다. 고령화 심화와 소득 증가로 성장 중인 베트남 치과 시장이 국산 기업의 핵심 수출 타깃이 되고 있다.", "src_name": "머니투데이", "src_url": "https://mt.co.kr/thebio/2026/10/06/2026100608484423438"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "blue", "tag": "업계뉴스", "icon": "🦷", "title": "글로벌 치과 임플란트 시장, 2034년 278억 달러 규모 전망 — 연평균 7.23% 성장", "body": "전 세계 치과 임플란트·보철 시장이 2026년 159억 달러에서 2034년 278억 달러로 성장할 것으로 예측된다. 디지털 워크플로 확산, 고령 인구 증가, 한국의 임플란트 급여 확대 등이 주요 성장 동인으로 꼽히고 있다.", "src_name": "Straits Research", "src_url": "https://straitsresearch.com/ko/report/dental-implants-and-prosthesis-market"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "green", "tag": "기술트렌드", "icon": "💡", "title": "디지털·AI·플랫폼으로 재편되는 K-덴탈 — 임플란트 성장 넘어 구조 전환 가속", "body": "한국 치과 산업이 임플란트 중심 성장 시대를 넘어 디지털·데이터·플랫폼 중심으로 산업 구조가 근본적으로 재편되고 있다는 분석이 나왔다. AI 진단, 구강 내 스캐너, CAD/CAM 통합 솔루션이 차세대 치과 경쟁력의 핵심으로 부상하고 있다.", "src_name": "덴탈아리랑", "src_url": "https://www.dentalarirang.com/news/articleView.html?idxno=47240"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "green", "tag": "기술트렌드", "icon": "💡", "title": "글로벌 치과 로봇 시장 2026년 6억 달러 돌파 — 2034년 21억 달러 성장 전망", "body": "글로벌 치과용 로봇 시장이 2026년 약 6억 2천만 달러 규모를 돌파하고, 2034년에는 21억 달러 이상으로 성장할 것으로 분석됐다. 임플란트 식립 로봇, 구강 수술 내비게이션 등 로봇 보조 수술 기술이 치과 임상 전반으로 확산되고 있다.", "src_name": "브런치", "src_url": "https://brunch.co.kr/@kid008/1203"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "green", "tag": "기술트렌드", "icon": "💡", "title": "치과 디지털 의료기기 사업화 기술지원 사업 마무리 단계 — AI 기반 기기 인허가 지원", "body": "산업통상부와 대구광역시가 공동 지원하는 치과 디지털 의료기기 사업화 기술지원 사업이 2026년 10월 마무리 단계에 접어들었다. AI 기반 치과 의료기기의 시험평가·인허가·소프트웨어 검증을 지원해 국내 스타트업의 시장 진입 기간을 단축시키는 성과를 거뒀다.", "src_name": "R&D Circle", "src_url": "https://app.rndcircle.io/gov-grant/717f2c7c-2b2c-413f-867b-87b0b2fb773d"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "purple", "tag": "건강보험", "icon": "🏥", "title": "2026년 치과 수가 2% 인상 — 점수당 단가 101.1원 적용", "body": "2026년 치과 수가가 전년 대비 2% 인상되어 점수당 단가 101.1원이 적용되고 있다. 치과의원 기준 급여 임플란트 1치당 수가는 135만 1,040원, 치과병원은 140만 9,790원으로 확정됐다.", "src_name": "치과신문", "src_url": "https://www.dentalnews.or.kr/news/article.html?no=46229"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "purple", "tag": "건강보험", "icon": "🏥", "title": "치과 임플란트 보철재료 확대 및 치아 우식검사 급여 확대 — 보건복지부 공식 발표", "body": "보건복지부가 치과 임플란트에 사용 가능한 보철재료 종류를 확대하고, 치아 우식(충치) 검사에 건강보험을 적용하는 방안을 공식 발표했다. 이번 조치로 더 많은 환자가 건강보험 혜택을 받을 수 있게 됐다.", "src_name": "보건복지부", "src_url": "https://www.mohw.go.kr/board.es?mid=a10503000000&bid=0027&act=view&list_no=1484121"}, {"date": "2026-10-07", "date_label": "2026.10.07", "color": "purple", "tag": "건강보험", "icon": "🏥", "title": "2026년 치과 급여·비급여 구분 세분화 — 기준 명확화로 환자 혼란 줄인다", "body": "2026년 건강보험 치과 급여 정책의 핵심 기조는 급여 범위를 무분별하게 확대하기보다 기준을 세분화해 명확히 고정하는 방향으로 정립됐다. 치과의원의 정확한 보험 항목 안내가 환자 신뢰도와 분쟁 예방에 직결된다는 인식이 높아지고 있다.", "src_name": "리버타드", "src_url": "https://libertadwebsite.com/%EC%B9%98%EA%B3%BC-%EC%B9%98%EB%A3%8C-%EA%B8%89%EC%97%AC-%EB%B
